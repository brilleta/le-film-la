pages:
  image: ghcr.io/pnpm/pnpm:12
  stage: deploy
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - pnpm config set store-dir .pnpm-store
    - pnpm runtime set node 26 -g
    - pnpm install --frozen-lockfile
  script:
    - 'test -n "$VITE_TMDB_TOKEN" || { echo "Variable CI/CD VITE_TMDB_TOKEN manquante"; exit 1; }'
    - pnpm lint
    - pnpm build
  pages:
    publish: dist
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
